<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUPI الرياض</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>:root{--p:#4a3f67;--bg:#f7f6fa;--c:#fff;--l:#e6e2ec;--m:#7c7689}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#241f36;font-family:system-ui,Arial}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l);padding:14px;display:flex;gap:12px;align-items:center}h1{font-size:17px;margin:0}.wrap{max-width:1180px;margin:auto;padding:15px 12px 90px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid var(--l);background:#fff;border-radius:15px;padding:14px}.stat b{display:block;font-size:24px;color:var(--p)}.stat span{font-size:10px;color:var(--m)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.search,.sel,.btn{border:1px solid var(--l);border-radius:10px;padding:10px;background:#fff}.search{flex:1;min-width:210px}.btn{font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff;border-color:var(--p)}table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:right;font-size:11px;vertical-align:top}th{background:#f1eef6;color:var(--m)}.table{overflow:auto;border:1px solid var(--l);border-radius:14px}.pill{padding:4px 7px;border-radius:999px;background:#eeeaf5;color:var(--p);font-size:10px;font-weight:700}.good{background:#e4f3eb;color:#176c47}.warn{background:#fff0d2;color:#996000}.drawer{position:fixed;top:0;right:-310px;bottom:0;width:290px;background:#fff;z-index:20;padding:18px;transition:.2s;box-shadow:-8px 0 30px #0002}.drawer.show{right:0}.drawer button{display:block;width:100%;border:0;background:transparent;padding:12px;text-align:right;border-radius:10px}.drawer button.active{background:#eeeaf5;color:var(--p);font-weight:800}.shade{display:none;position:fixed;inset:0;background:#0006;z-index:19}.shade.show{display:block}nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#fff;border-top:1px solid var(--l);display:flex;z-index:10}nav button{flex:1;border:0;background:transparent;color:var(--m);font-size:10px}nav .active{color:var(--p)}#map{height:540px;border-radius:14px}.toggle{display:flex;background:#eeeaf5;padding:3px;border-radius:10px}.toggle button{border:0;padding:8px 12px;border-radius:8px}.toggle .on{background:#fff;color:var(--p)}@media(max-width:600px){.grid{gap:5px}.stat{padding:11px 4px}.stat b{font-size:19px}#map{height:450px}}</style></head><body><header><button class="btn" id="menu">☰</button><div style="flex:1"><h1 id="title">MUPI الرياض</h1><small>إدارة فرع الرياض</small></div><button class="btn" id="importAll">استيراد Excel</button></header><div class="shade" id="shade"></div><aside class="drawer" id="drawer"><h2>MUPI · الرياض</h2><div id="drawerList"></div></aside><main class="wrap" id="app"></main><nav id="nav"></nav><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden><script>const S={locations:[],campaigns:[],incidents:[],custody:[]};let tab='home',q='',filter='',view='list',map;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const coord=v=>{let n=parseFloat(String(v??'').replace(/[^\d.+-]/g,''));return Number.isFinite(n)?n:null};const loc=id=>S.locations.find(x=>String(x.id)===String(id));const activeCampaign=r=>/حملة سارية/.test(r.status||'');const activeCustody=r=>(r.status==='تم الاستلام'||(r.received&&!r.disbursed));const pill=x=>`<span class="pill ${/تم|سارية|سليمة/.test(String(x))?'good':/جاري|قيد|تالفة/.test(String(x))?'warn':''}">${esc(x||'—')}</span>`;function save(){localStorage.setItem('mupi-v2',JSON.stringify(S))}function load(){try{let x=JSON.parse(localStorage.getItem('mupi-v2'));if(x)Object.assign(S,x)}catch{}}function go(x){tab=x;q='';filter='';render()}function home(){let ac=S.campaigns.filter(activeCampaign).length,al=S.locations.filter(x=>coord(x.x)!=null&&coord(x.y)!=null).length,au=S.custody.filter(activeCustody).length;let r=[];if(q){[['الحوادث',S.incidents,'incidents'],['الحملات',S.campaigns,'campaigns'],['العهد',S.custody,'custody'],['المواقع',S.locations,'locations']].forEach(([t,a,o])=>a.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q.toLowerCase()))r.push([t,x,o])}))}return `<div class="card"><input id="hq" class="search" value="${esc(q)}" placeholder="ابحث في الإشعارات والسجلات المهمة..."></div><div class="grid"><button class="stat" data-go="campaigns"><b>${ac}</b><span>الحملات النشطة</span></button><button class="stat" data-go="locations"><b>${al}</b><span>المواقع الفعلية</span></button><button class="stat" data-go="custody"><b>${au}</b><span>العهد النشطة</span></button></div><div class="card" style="margin-top:12px"><h3>الوصول السريع</h3>${(q?r.slice(0,50):[['الحوادث المفتوحة',{},'incidents'],['مواقع اللوحات',{},'locations'],['العهد المالية',{},'custody']]).map(x=>`<button class="row" style="width:100%;padding:12px;border:0;background:transparent;text-align:right;border-bottom:1px solid #eee" data-go="${x[2]}"><b>${esc(x[0])}</b></button>`).join('')}</div>`}function incidents(){let a=S.incidents.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));return `<div class="toolbar"><input id="q" class="search" value="${esc(q)}" placeholder="بحث في الحوادث..."><button class="btn primary" id="ex">تصدير Excel</button><button class="btn" id="pr">طباعة مخصصة</button></div><div class="table"><table><tr><th>رقم اللوحة</th><th>نوع اللوحة</th><th>الوصف</th><th>الموقع</th><th>الحالة</th><th>القاعدة</th><th>حالة المعالجة</th></tr>${a.map(x=>`<tr><td>${esc(x.posterNo)}</td><td>${esc(x.contractType)}</td><td>${esc(x.desc)}</td><td>${esc(x.location||loc(x.posterNo)?.desc)}</td><td>${pill(x.removalStatus||'جاري الإزالة')}</td><td>${pill(x.baseStatus||'سليمة')}</td><td>${pill(x.processingStatus||'قيد المعالجة')}</td></tr>`).join('')}</table></div>`}function locations(){let a=S.locations.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));return `<div class="toolbar"><input id="q" class="search" value="${esc(q)}" placeholder="بحث في المواقع..."><div class="toggle"><button id="ls" class="${view==='list'?'on':''}">قائمة</button><button id="mp" class="${view==='map'?'on':''}">خريطة</button></div><button class="btn primary" id="ki">استيراد KML</button><button class="btn" id="ko">تصدير KML</button><button class="btn" id="xi">استيراد Excel</button><button class="btn" id="xo">تصدير Excel</button><button class="btn" id="pr">طباعة مخصصة</button></div><div class="card"><b>إجمالي المواقع: ${S.locations.length}</b></div>${view==='map'?'<div class="card"><div id="map"></div></div>':`<div class="table"><table><tr><th>رقم اللوحة</th><th>نوع اللوحة</th><th>الإحداثيات</th><th>الوصف / الموقع</th><th>الحالة</th></tr>${a.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.type)}</td><td>${esc(x.x)}, ${esc(x.y)}</td><td>${esc(x.desc)}</td><td>${pill(x.incidentStatus)}</td></tr>`).join('')}</table></div>`}`}function custody(){let a=S.custody.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));return `<div class="toolbar"><input id="q" class="search" value="${esc(q)}" placeholder="بحث في العهد المالية..."><button class="btn primary" id="ex">تصدير Excel</button><button class="btn" id="pr">طباعة مخصصة</button></div><div class="table"><table><tr><th>تاريخ الطلب</th><th>الغرض من العهدة</th><th>المبلغ</th><th>الحالة</th><th>تاريخ التسوية</th></tr>${a.map(x=>`<tr><td>${esc(x.requestDate)}</td><td>${esc(x.purpose)}</td><td>${esc(x.amount)}</td><td>${pill(x.status||'تم الاستلام')}</td><td>${esc(x.settleDate)}</td></tr>`).join('')}</table></div>`}function campaigns(){let a=S.campaigns.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));return `<div class="toolbar"><input id="q" class="search" value="${esc(q)}" placeholder="بحث في الحملات..."><button class="btn primary" id="ex">تصدير Excel</button></div><div class="table"><table><tr><th>التاريخ</th><th>العميل</th><th>رقم البوستر</th><th>الشبكة</th><th>العدد</th><th>اللوحة</th><th>الحالة</th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.client)}</td><td>${esc(x.posterNo)}</td><td>${esc(x.network)}</td><td>${esc(x.count)}</td><td>${esc(x.board)}</td><td>${pill(x.status)}</td></tr>`).join('')}</table></div>`}function exp(rows,name){let w=XLSX.utils.book_new(),s=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(w,s,'البيانات');XLSX.writeFile(w,name)}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));let z=document.getElementById('q')||document.getElementById('hq');if(z)z.oninput=e=>{q=e.target.value;render()};let ex=document.getElementById('ex');if(ex)ex.onclick=()=>exp(tab==='incidents'?S.incidents:tab==='custody'?S.custody:S.campaigns,'MUPI_'+tab+'.xlsx');let ls=document.getElementById('ls');if(ls)ls.onclick=()=>{view='list';render()};let mp=document.getElementById('mp');if(mp)mp.onclick=()=>{view='map';render()};let xo=document.getElementById('xo');if(xo)xo.onclick=()=>exp(S.locations,'MUPI_مواقع_اللوحات.xlsx');let xi=document.getElementById('xi');if(xi)xi.onclick=()=>document.getElementById('file').click();let ki=document.getElementById('ki');if(ki)ki.onclick=()=>kmlIn();let ko=document.getElementById('ko');if(ko)ko.onclick=kmlOut;let pr=document.getElementById('pr');if(pr)pr.onclick=()=>window.print();if(tab==='locations'&&view==='map')setTimeout(mapInit,30)}function mapInit(){let e=document.getElementById('map');if(!e||!window.L)return;if(map)map.remove();map=L.map(e).setView([24.7136,46.6753],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);S.locations.forEach(x=>{let a=coord(x.x),b=coord(x.y);if(a!=null&&b!=null)L.marker([b,a]).addTo(map).bindPopup(`<b>${esc(x.id)}</b><br>${esc(x.desc)}`)})}function kmlOut(){let k='<?xml version="1.0"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>'+S.locations.map(x=>{let a=coord(x.x),b=coord(x.y);return a==null||b==null?'':`<Placemark><name>${esc(x.id)}</name><description>${esc(x.desc)}</description><Point><coordinates>${a},${b},0</coordinates></Point></Placemark>`}).join('')+'</Document></kml>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([k],{type:'application/vnd.google-earth.kml+xml'}));a.download='MUPI_Riyadh.kml';a.click()}function kmlIn(){let f=document.getElementById('file');f.accept='.kml';f.onchange=async()=>{let x=await f.files[0].text(),d=new DOMParser().parseFromString(x,'text/xml'),o=[];d.querySelectorAll('Placemark').forEach((p,i)=>{let c=(p.querySelector('Point coordinates')?.textContent||'').trim().split(',');if(c.length>1)o.push({id:p.querySelector('name')?.textContent||i+1,contract:'MUPI',type:'',desc:p.querySelector('description')?.textContent||'',x:c[0],y:c[1],note:'',team:''})});S.locations=o;save();render()};f.click()}document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let w=XLSX.read(await f.arrayBuffer(),{type:'array'});let get=n=>XLSX.utils.sheet_to_json(w.Sheets[n],{defval:''});S.locations=get('مواقع اللوحات').map((r,i)=>({id:r['رقم اللوحة']||i+1,contract:r['نوع العقد']||'MUPI',type:r['نوع اللوحة']||'',desc:r['الوصف']||'',x:r.X??'',y:r.Y??'',note:r['ملاحظة']||'',team:r.TEAMS||''}));S.campaigns=get('الحملات الاعلانية').map(r=>({date:r['التاريخ'],client:r['اسم العميل'],posterNo:r['رقم البوستر'],network:r['الشبكة'],count:r['العدد'],board:r['اللوحة'],status:r['حالة البوستر'],weeks:r['عدد الأسابيع'],notes:r['ملاحظات']}));S.incidents=get('الحوادث').map(r=>({date:r['التاريخ'],posterNo:r['رقم اللوحة'],contractType:r['نوع القعد'],purpose:r['غرض الصيانة'],desc:r['الوصف'],location:loc(r['رقم اللوحة'])?.desc||'',removalStatus:r['تمت الازالة']?'تمت الإزالة':'جاري الإزالة',baseStatus:r['تم انشاء قاعدة']==='سليمة'?'سليمة':'تالفة',processingStatus:r['تمت المعالجة']?'تمت المعالجة':'قيد المعالجة',resolveDate:r['تاريخ المعالجة']}));S.custody=get('العهد المعالية').map(r=>({requestDate:r['تاريخ طلب العهدة'],purpose:r['الغرض'],amount:r['المبلغ'],status:r['صرف']?'تم التسوية':'تم الاستلام',settleDate:r['تاريخ التسوية']}));save();render()};document.getElementById('importAll').onclick=()=>document.getElementById('file').click();document.getElementById('menu').onclick=()=>{drawer.classList.add('show');shade.classList.add('show')};document.getElementById('shade').onclick=()=>{drawer.classList.remove('show');shade.classList.remove('show')};function render(){title.textContent={home:'MUPI الرياض',locations:'مواقع اللوحات',campaigns:'الحملات الإعلانية',incidents:'الحوادث',custody:'العهد المالية'}[tab];app.innerHTML=tab==='home'?home():tab==='locations'?locations():tab==='incidents'?incidents():tab==='custody'?custody():campaigns();bind();drawerList.innerHTML=[['home','الرئيسية'],['locations','مواقع اللوحات'],['campaigns','الحملات الإعلانية'],['incidents','الحوادث'],['custody','العهد المالية']].map(x=>`<button class="${tab===x[0]?'active':''}" data-go="${x[0]}">${x[1]}</button>`).join('');drawerList.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{go(x.dataset.go);drawer.classList.remove('show');shade.classList.remove('show')});nav.innerHTML=[['home','الرئيسية'],['locations','اللوحات'],['incidents','الحوادث'],['custody','العهد']].map(x=>`<button class="${tab===x[0]?'active':''}" data-go="${x[0]}">${x[1]}</button>`).join('');nav.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go))}load();render();</script></body></html>
